services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary_management_system_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salary -d salary_management_system_development"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://salary:salary@db:5432/salary_management_system_development
      RAILS_ENV: development
      HR_PASSWORD: password
      SECRET_KEY_BASE: dev-secret-key-base-for-local-salary-management-only
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
